<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wood.loc.cc</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Songti SC", "Noto Serif TC", "PMingLiU", "PingFang TC", serif;
      background: #f4efe6;
      color: #1c1a16;
    }
    main {
      text-align: center;
      padding: 2.5rem 1.5rem;
      max-width: 36rem;
    }
    h1 {
      font-weight: 500;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      letter-spacing: 0.02em;
    }
    p {
      margin-top: 1.25rem;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #5a554c;
    }
    .en, .zh { display: block; }
    .zh { margin-top: 0.2rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #161411; color: #f4efe6; }
      p { color: #b8b1a5; }
    }
  </style>
</head>
<body>
  <main>
    <h1>wood.loc.cc</h1>
    <p>
      <span class="en">Welcome to wood.loc.cc</span>
      <span class="zh">歡迎來到 wood.loc.cc</span>
    </p>
  </main>
</body>
</html>
